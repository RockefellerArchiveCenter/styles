name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 'lts/*'

      - name: Cache dependencies
        uses: actions/cache@v6.1.0
        id: yarn-cache
        with:
          path: ./node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install

      - name: Run linting
        run: yarn lint

      - name: Run tests
        run: yarn test