name: Deploy Style Library

on:
  pull_request:
    types: [closed]
    branches:
      - base
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy, e.g. 2.0.10'
        required: true

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'release-please--')
      )
    runs-on: ubuntu-latest

    environment:
      name: base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: base

      - name: Use Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 'lts/*'

      - name: Cache dependencies
        uses: actions/cache@v5.0.5
        id: yarn-cache
        with:
          path: ./node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install

      - name: Compile stylesheet
        run: yarn compile

      - name: Build the release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(echo "${{ github.event.pull_request.title }}" | sed -E 's/^.*release ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')"
          fi

          script/build_release.sh "v${VERSION}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          role-skip-session-tagging: true
          role-duration-seconds: 900
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync ${{ secrets.LOCAL_DIR_LIBRARY }} s3://${{ secrets.AWS_LIBRARY_BUCKET_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --region ${{ secrets.AWS_REGION }} --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_LIBRARY }} --paths "/*"